services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus_core
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_core"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nexus-network

volumes:
  postgres_data:
    driver: local

networks:
  nexus-network:
    driver: bridge
