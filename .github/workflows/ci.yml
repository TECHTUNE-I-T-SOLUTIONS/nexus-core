name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: cd backend && ./mvnw clean verify -B

    - name: Run Unit Tests
      run: cd backend && ./mvnw test -B

    - name: Generate Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: backend/target/surefire-reports/*.xml
        reporter: java-junit
        fail-on-error: true

    - name: Code Coverage
      run: cd backend && ./mvnw jacoco:report

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: backend/target/site/jacoco/jacoco.xml
        flags: backend
        name: codecov-backend

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run OWASP Dependency Check
      run: cd backend && ./mvnw org.owasp:dependency-check-maven:check

    - name: Upload Dependency Check Report
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-report
        path: backend/target/dependency-check-report.html

  lint:
    name: Code Style Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Checkstyle
      run: cd backend && ./mvnw checkstyle:check

    - name: Spotbugs
      run: cd backend && ./mvnw spotbugs:check
