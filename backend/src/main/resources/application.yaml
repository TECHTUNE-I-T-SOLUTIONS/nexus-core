spring:
  application:
    name: nexus-core
  datasource:
    url: jdbc:postgresql://localhost:5432/nexus_core
    username: nexus
    password: nexuspassword123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.techtune.nexus: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/nexus-core.log

nexus:
  worker:
    enabled: false
    polling-interval: 5s
    batch-size: 10
    concurrency: 5
    lease-duration-seconds: 60
    worker-id: ${WORKER_ID:}
  scheduler:
    enabled: false
    polling-interval: 60s
  webhook:
    delivery:
      enabled: false
      polling-interval: 30s
      batch-size: 10
      max-retries: 3
      connection-timeout-seconds: 10
      response-timeout-seconds: 30
      lease-duration-seconds: 300
    encryption:
      enabled: ${WEBHOOK_ENCRYPTION_ENABLED:false}
      key: ${WEBHOOK_ENCRYPTION_KEY:}
    rate-limit:
      max-requests: 100
      window-seconds: 60
  auth:
    email:
      enabled: ${EMAIL_ENABLED:false}
      provider: ${EMAIL_PROVIDER:zoho} # zoho, gmail, smtp
      host: ${EMAIL_HOST:smtp.zoho.com}
      port: ${EMAIL_PORT:587}
      username: ${EMAIL_USERNAME:}
      password: ${EMAIL_PASSWORD:}
      from: ${EMAIL_FROM:noreply@yourdomain.com}
      from-name: ${EMAIL_FROM_NAME:NEXUS CORE}
      verification-enabled: ${EMAIL_VERIFICATION_ENABLED:false}
      password-reset-enabled: ${EMAIL_PASSWORD_RESET_ENABLED:false}
      token-expiration-minutes: ${EMAIL_TOKEN_EXPIRATION_MINUTES:30}
