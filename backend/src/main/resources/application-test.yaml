spring:
  datasource:
    url: ${TESTCONTAINERS_POSTGRESQL_URL:jdbc:postgresql://localhost:5432/test}
    username: ${TESTCONTAINERS_POSTGRESQL_USERNAME:test}
    password: ${TESTCONTAINERS_POSTGRESQL_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC
