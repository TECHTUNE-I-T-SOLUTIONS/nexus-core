spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///nexus_core
    username: nexus
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.techtune.nexus: INFO
    org.springframework: WARN
    org.hibernate: WARN
